<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر صاصا التاريخ 🧙</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #333;
            --card-bg: #fff;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --border-color: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --primary-color: #818cf8;
            --primary-hover: #6366f1;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        .services-list {
            display: grid;
            gap: 10px;
        }

        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
    </style>
</head>
<body data-theme="light">

    <div class="container">
        <header>
            <h1>متجر صاصا التاريخ 🧙</h1>
            <button onclick="toggleTheme()">تبديل الوضع 🌓</button>
        </header>

        <div class="card">
            <h2>قائمة الخدمات</h2>
            <div class="services-list" id="servicesList">
                <div class="service-item">
                    <span>شحن جواهر فري فاير</span>
                    <strong>100 جنيه</strong>
                </div>
                <div class="service-item">
                    <span>باقة إنترنت WE أرضي</span>
                    <strong>150 جنيه</strong>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>طلب خدمة</h2>
            <div class="form-group">
                <label>اختر الخدمة</label>
                <select id="serviceSelect">
                    <option value="فري فاير">شحن جواهر فري فاير</option>
                    <option value="إنترنت WE">باقة إنترنت WE أرضي</option>
                </select>
            </div>
            <div class="form-group">
                <label>رقم الحساب / الآيدي / التفاصيل</label>
                <input type="text" id="targetInfo" placeholder="أدخل البيانات هنا...">
            </div>
            <button onclick="sendOrder()">تأكيد وإرسال لتليجرام 🚀</button>
        </div>
    </div>

    <script>
        // إعدادات تليجرام (قم بوضع المعرف الخاص بك هنا بدلاً من النص الفارغ أو الوهمي)
        const TELEGRAM_BOT_TOKEN = "YOUR_BOT_TOKEN_HERE"; 
        const TELEGRAM_CHAT_ID = "YOUR_CHAT_ID_HERE"; // تم إكمال المتغير هنا لتجنب خطأ التوقف

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute("data-theme");
            body.setAttribute("data-theme", currentTheme === "light" ? "dark" : "light");
        }

        function sendOrder() {
            const service = document.getElementById('serviceSelect').value;
            const target = document.getElementById('targetInfo').value;

            if (!target) {
                alert("يرجى إدخال بيانات الحساب أو الآيدي المطلوب!");
                return;
            }

            const message = `طلب جديد من متجر صاصا التاريخ 🧙\n\n الخدمة: ${service}\n البيانات: ${target}`;
            
            if (TELEGRAM_BOT_TOKEN === "YOUR_BOT_TOKEN_HERE" || TELEGRAM_CHAT_ID === "YOUR_CHAT_ID_HERE") {
                alert("يرجى ضبط بيانات بوت تليجرام (Token و Chat ID) في الكود البرمجي أولاً لعمل الإرسال بنجاح.");
                return;
            }

            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(message)}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        alert("تم إرسال طلبك بنجاح!");
                        document.getElementById('targetInfo').value = '';
                    } else {
                        alert("حدث خطأ أثناء الإرسال، تأكد من صحة بيانات البوت.");
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("تعذر الاتصال بالخادم.");
                });
        }
    </script>
</body>
</html>
