<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر صاصا التاريخ 🧙</title>
    <style>
        :root {
            --bg-overlay: rgba(0, 0, 0, 0.7);
            --card-bg: rgba(20, 20, 20, 0.65);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
            --sub-text: #ddd;
            --accent-color: #e50914;
            --input-bg: rgba(0, 0, 0, 0.6);
            --input-text: #fff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        body {
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('https://i.ibb.co/680326H/IMG-4093-b993a8.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            color: white;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            border-bottom: 1px solid var(--card-border);
        }
        
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--card-border);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }
        .theme-toggle-btn:hover { background: rgba(255, 255, 255, 0.25); }

        .container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
        
        .stats-container { display: flex; gap: 15px; margin-bottom: 25px; }
        .stat-card { flex: 1; background: var(--card-bg); backdrop-filter: blur(10px); padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 1px solid var(--card-border); }
        .stat-number { font-size: 1.8rem; font-weight: bold; color: #64b5f6; }
        .stat-label { font-size: 0.9rem; color: #aaa; }

        .category-btn { width: 100%; background: rgba(30, 60, 114, 0.8); backdrop-filter: blur(10px); color: white; border: 1px solid var(--card-border); padding: 15px; text-align: right; font-size: 1.2rem; font-weight: bold; border-radius: 10px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .category-btn:hover { background: rgba(30, 60, 114, 0.95); }

        .category-content { display: none; margin-bottom: 20px; padding: 10px; background: var(--card-bg); backdrop-filter: blur(12px); border-radius: 10px; border: 1px solid var(--card-border); }
        .service-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .service-item:last-child { border-bottom: none; }
        
        .badge-open { background: #2ecc71; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; }
        .badge-closed { background: #e74c3c; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; }

        .btn-order { background: #e50914; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
        .btn-order:hover { background: #ff1e27; }
        .btn-disabled { background: #444; color: #888; border: none; padding: 6px 12px; border-radius: 6px; cursor: not-allowed; font-size: 0.9rem; }

        .section-box { background: var(--card-bg); backdrop-filter: blur(12px); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-bottom: 25px; border: 1px solid var(--card-border); }
        .section-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #64b5f6; border-bottom: 2px solid #64b5f6; padding-bottom: 5px; }
        
        .order-track-card { background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
