<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر صاصا التاريخ 🧙</title>
    <style>
        :root {
            --bg-overlay: rgba(0, 0, 0, 0.75);
            --card-bg: rgba(30, 30, 30, 0.75);
            --border-color: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
            --header-bg: linear-gradient(135deg, #e50914, #1e3c72);
            --sub-card: rgba(40, 40, 40, 0.85);
            --input-bg: rgba(20, 20, 20, 0.8);
            --input-text: #fff;
        }
        [data-theme="dark"] {
            --bg-overlay: rgba(0, 0, 0, 0.85);
            --card-bg: rgba(20, 20, 20, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #e0e0e0;
            --header-bg: linear-gradient(135deg, #b20710, #0f1f3d);
            --sub-card: rgba(30, 30, 30, 0.9);
            --input-bg: rgba(15, 15, 15, 0.9);
            --input-text: #fff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('https://i.ibb.co/5gJzK3zf/IMG-4093.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color); 
            line-height: 1.6; 
            min-height: 100vh;
        }
        header { background: var(--header-bg); color: white; padding: 30px 20px; text-align: center; position: relative; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
        .section-box { background: var(--card-bg); padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid var(--border-color); }
        .category-btn { width: 100%; background: #1e3c72; color: white; border: none; padding: 15px; text-align: right; font-size: 1.2rem; font-weight: bold; border-radius: 8px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .category-content { display: none; margin-bottom: 20px; padding: 10px; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); }
        .service-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border-color); }
        .btn-order { background: #e50914; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .admin-trigger { background: #34495e; color: white; padding: 12px; text-align: center; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .admin-panel { display: none; background: var(--card-bg); padding: 20px; border-radius: 8px; border: 2px solid #34495e; margin-top: 10px; }
        .admin-order-card { background: var(--sub-card); padding: 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid var(--border-color); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-box { background: var(--card-bg); color: var(--text-color); padding: 25px; border-radius: 10px; width: 90%; max-width: 450px; border: 1px solid var(--border-color); }
    </style>
</head>
<body data-theme="dark">

    <header>
        <h1>متجر صاصا التاريخ 🧙</h1>
    </header>

    <div class="container">
        <div class="section-box">
            <h3>📌 متابعة طلباتي السحابية لحظياً</h3>
            <div id="userOrdersList">
                <p style="color: #f39c12;">جاري الاتصال بالسحابة...</p>
            </div>
        </div>

        <button class="category-btn" onclick="toggleCategory('vodaCategory')"><span>خدمات فودافون 💙✨</span> <span>▼</span></button>
        <div class="category-content" id="vodaCategory">
            <div class="service-item"><div><strong>سحب بيانات فودافون</strong> - 60 ج.م</div><button class="btn-order" onclick="openOrderModal('سحب بيانات فودافون', 60)">طلب</button></div>
        </div>

        <div class="admin-trigger" onclick="accessAdminPanel()">⚙️ لوحة تحكم الأدمن 🔐</div>
        
        <div class="admin-panel" id="adminPanel">
            <h3>🔑 إدارة الطلبات السحابية</h3>
            <div id="adminOrdersList"><p style="color: #aaa;">جاري جلب الطلبات...</p></div>
        </div>
    </div>

    <!-- نافذة الطلب -->
    <div class="modal" id="orderModal">
        <div class="modal-box">
            <h3 id="modalServiceName"></h3>
            <p style="color: #e50914; margin: 10px 0;">المبلغ: <span id="modalServicePrice"></span> ج.م</p>
            <form onsubmit="submitOrder(event)">
                <input type="text" id="custName" placeholder="اسمك بالكامل" required style="width:100%; margin-bottom:8px; padding:8px; background:#222; color:#fff; border:1px solid #444;">
                <input type="tel" id="custPhone" placeholder="رقم الواتساب" required style="width:100%; margin-bottom:8px; padding:8px; background:#222; color:#fff; border:1px solid #444;">
                <input type="text" id="custTarget" placeholder="الرقم المستهدف / اليوزر" required style="width:100%; margin-bottom:12px; padding:8px; background:#222; color:#fff; border:1px solid #444;">
                <button type="submit" class="btn-order" style="width:100%; background:#2ecc71; padding:10px;">إرسال الطلب</button>
                <button type="button" class="btn-order" style="width:100%; background:#444; margin-top:5px; padding:8px;" onclick="closeOrderModal()">إلغاء</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD-mock-key-sasa-store",
            authDomain: "sasailmoseba1.firebaseapp.com",
            projectId: "sasailmoseba1",
            storageBucket: "sasailmoseba1.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        let db;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
        } catch(e) {
            console.log("Firebase init error", e);
        }

        let currentServiceName = "";
        let currentServicePrice = 0;

        function toggleCategory(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function accessAdminPanel() {
            let pass = prompt("أدخل كلمة مرور لوحة تحكم الأدمن 🔐:");
            if (pass === "sasailmoseba1") {
                const panel = document.getElementById('adminPanel');
                panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة! ❌");
            }
        }

        function openOrderModal(name, price) {
            currentServiceName = name;
            currentServicePrice = price;
            document.getElementById('modalServiceName').innerText = name;
            document.getElementById('modalServicePrice').innerText = price;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function submitOrder(e) {
            e.preventDefault();
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const target = document.getElementById('custTarget').value;

            const newOrder = {
                service: currentServiceName,
                price: currentServicePrice,
                name,
                phone,
                target,
                status: 'قيد المراجعة ⏳',
                timestamp: Date.now()
            };

            if(db) {
                db.collection("store_orders").add(newOrder).then(() => {
                    closeOrderModal();
                    alert('تم إرسال طلبك بنجاح للسحابة! 🚀');
                }).catch((err) => {
                    alert('فشل الإرسال للسحابة، تأكد من اتصال الإنترنت أو قواعد الأمان.');
                });
            } else {
                alert('قاعدة البيانات غير متصلة!');
            }
        }

        // الاستماع المباشر للطلبات من السحابة
        if(db) {
            db.collection("store_orders").onSnapshot((snapshot) => {
                let orders = [];
                snapshot.forEach((doc) => {
                    let data = doc.data();
                    data.id = doc.id;
                    orders.push(data);
                });

                // عرض طلبات العملاء
                const userList = document.getElementById('userOrdersList');
                if(orders.length === 0) {
                    userList.innerHTML = '<p style="color: #aaa;">لا توجد طلبات سحابية حالياً.</p>';
                } else {
                    userList.innerHTML = orders.map(o => `
                        <div style="background:rgba(255,255,255,0.05); padding:8px; margin-bottom:5px; border-radius:5px;">
                            <strong>${o.service}</strong> - الحالة: <span style="color:#f39c12;">${o.status}</span>
                        </div>
                    `).join('');
                }

                // عرض لوحة الأدمن
                const adminList = document.getElementById('adminOrdersList');
                if(orders.length === 0) {
                    adminList.innerHTML = '<p style="color: #aaa;">لا توجد طلبات مسجلة.</p>';
                } else {
                    adminList.innerHTML = orders.map(o => `
                        <div class="admin-order-card">
                            <p><strong>الخدمة:</strong> ${o.service} (${o.price} ج.م)</p>
                            <p><strong>العميل:</strong> ${o.name} - ${o.phone}</p>
                            <p><strong>الهدف:</strong> ${o.target}</p>
                            <p><strong>الحالة:</strong> ${o.status}</p>
                            <div style="margin-top: 8px; display: flex; gap: 5px;">
                                <button class="btn-order" style="background:#2ecc71;" onclick="updateStatus('${o.id}', 'مقبول ✅')">قبول</button>
                                <button class="btn-order" style="background:#e74c3c;" onclick="updateStatus('${o.id}', 'مرفوض ❌')">رفض</button>
                                <button class="btn-order" style="background:#7f8c8d;" onclick="deleteOrder('${o.id}')">حذف</button>
                            </div>
                        </div>
                    `).join('');
                }
            });
        }

        function updateStatus(id, status) {
            if(db) {
                db.collection("store_orders").doc(id).update({ status: status });
            }
        }

        function deleteOrder(id) {
            if(db) {
                db.collection("store_orders").doc(id).delete();
            }
        }
    </script>
</body>
</html>
