<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ تأكد أن البيانات دي مطابقة تماماً للي في لوحة تحكم Firebase عندك
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    let db;
    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        console.log("Firebase Connected Successfully! ✅");
    } catch (err) {
        console.error("Firebase Init Error:", err);
        alert("خطأ في الاتصال بـ Firebase: تأكد من صحة الـ Config");
    }

    const BOT_TOKEN = "8701847388:AAHfbO-Mp0tZ87dn7NvqLHXekU_XRplyHec";
    const CHAT_ID = "7677969589";

    // الاستماع للأسعار وتحديثها لحظياً
    if (db) {
        onSnapshot(doc(db, "settings", "prices"), (docSnap) => {
            if (docSnap.exists()) {
                const prices = docSnap.data();
                document.querySelectorAll('.price-val').forEach(el => {
                    const id = el.getAttribute('data-id');
                    if (prices[id]) {
                        el.innerText = prices[id];
                        if(document.getElementById('p_' + id)) {
                            document.getElementById('p_' + id).value = prices[id];
                        }
                    }
                });
            }
        });

        // الاستماع للطلبات وتحديثها لحظياً
        onSnapshot(collection(db, "orders"), (snapshot) => {
            let orders = [];
            snapshot.forEach((docSnap) => {
                orders.push({ id: docSnap.id, ...docSnap.data() });
            });

            orders.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            document.getElementById('totalOrdersCount').innerText = orders.length;

            // عرض طلبات العميل
            const userContainer = document.getElementById('userOrdersList');
            if (orders.length === 0) {
                userContainer.innerHTML = '<p style="color: #777; text-align: center;">لا توجد طلبات سابقة لديك حالياً.</p>';
            } else {
                let html = '';
                orders.forEach(ord => {
                    let badgeClass = 'badge-pending';
                    if (ord.statusCode === 'approved') badgeClass = 'badge-approved';
                    if (ord.statusCode === 'rejected') badgeClass = 'badge-rejected';

                    html += `
                        <div class="order-track-card">
                            <div>
                                <strong>${ord.serviceName}</strong> (${ord.price} ج.م)<br>
                                <small style="color: #666;">المستهدف: ${ord.custTarget} | ${ord.date || ''}</small>
                            </div>
                            <div>
                                <span class="${badgeClass}">${ord.status}</span>
                            </div>
                        </div>
                    `;
                });
                userContainer.innerHTML = html;
            }

            // عرض لوحة تحكم الأدمن
            const adminContainer = document.getElementById('adminOrdersList');
            if (orders.length === 0) {
                adminContainer.innerHTML = '<p style="color: #777;">لا توجد طلبات معلقة حالياً.</p>';
            } else {
                let adminHtml = '';
                orders.forEach(ord => {
                    adminHtml += `
                        <div class="admin-order-card">
                            <div><strong>رقم الطلب:</strong> ${ord.id}</div>
                            <div><strong>الخدمة:</strong> ${ord.serviceName} (${ord.price} ج.م)</div>
                            <div><strong>العميل:</strong> ${ord.custName} (${ord.custPhone})</div>
                            <div><strong>الرقم المستهدف:</strong> ${ord.custTarget}</div>
                            <div><strong>الحالة:</strong> ${ord.status}</div>
                            <div style="margin-top: 10px; display: flex; gap: 10px;">
                                <button class="btn-accept" onclick="updateOrderStatus('${ord.id}', 'approved')">موافقة وتنفيد ✅</button>
                                <button class="btn-reject" onclick="updateOrderStatus('${ord.id}', 'rejected')">رفض الطلب ❌</button>
                            </div>
                        </div>
                    `;
                });
                adminContainer.innerHTML = adminHtml;
            }
        });
    }

    // إرسال الطلب مع معالجة الأخطاء بالكامل
    window.submitFirebaseOrder = async function(e) {
        e.preventDefault();
        
        if (!db) {
            alert("قاعدة البيانات غير متصلة!");
            return;
        }

        const serviceName = document.getElementById('modalServiceName').innerText;
        const price = document.getElementById('modalServicePrice').innerText;
        const custName = document.getElementById('custName').value;
        const custPhone = document.getElementById('custPhone').value;
        const custTarget = document.getElementById('custTarget').value;
        const submitBtn = document.getElementById('submitBtn');

        submitBtn.innerText = "جاري الإرسال للسحابة...";
        submitBtn.disabled = true;

        const timeNow = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

        try {
            // 1. حفظ الطلب في Firestore
            await addDoc(collection(db, "orders"), {
                serviceName: serviceName,
                price: price,
                custName: custName,
                custPhone: custPhone,
                custTarget: custTarget,
                status: 'قيد المراجعة ⏳',
                statusCode: 'pending',
                date: timeNow,
                createdAt: Date.now()
            });

            // 2. إرسال تنبيه لبوت تيليجرام
            const message = `🧙 <b>طلب جديد في متجر صاصا (سحابي)!</b>\n\n` +
                            `📦 <b>الخدمة:</b> ${serviceName}\n` +
                            `💰 <b>السعر:</b> ${price} ج.م\n` +
                            `👤 <b>اسم العميل:</b> ${custName}\n` +
                            `📱 <b>واتساب:</b> ${custPhone}\n` +
                            `🎯 <b>المستهدف:</b> ${custTarget}\n` +
                            `⏰ <b>الوقت:</b> ${timeNow}`;

            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' })
            });

            alert('تم إرسال طلبك بنجاح وحفظه في النظام السحابي!');
            closeModal();
            document.getElementById('custName').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('custTarget').value = '';
        } catch (err) {
            console.error("Order submission error:", err);
            alert('حدث خطأ أثناء الإرسال: ' + err.message);
        } finally {
            submitBtn.innerText = "تأكيد الطلب وإرسال الإسكرين 🚀";
            submitBtn.disabled = false;
        }
    };

    window.savePricesToFirebase = async function() {
        const ids = ['v1', 'v2', 'v3', 'e1', 'o1', 'w1', 't1', 'c1'];
        const newPrices = {};
        ids.getElementById ? ids.forEach(id => { newPrices[id] = document.getElementById('p_' + id).value; }) : null;
        // تصحيح مؤقت لقائمة الأسعار
        ['v1', 'v2', 'v3', 'e1', 'o1', 'w1', 't1', 'c1'].forEach(id => {
            const input = document.getElementById('p_' + id);
            if(input) newPrices[id] = input.value;
        });
        try {
            await setDoc(doc(db, "settings", "prices"), newPrices);
            alert('✅ تم حفظ وتحديث الأسعار سحابياً وتطبيقها فوراً!');
        } catch (e) {
            alert('خطأ في حفظ الأسعار: ' + e.message);
        }
    };

    window.updateOrderStatus = async function(docId, newStatusCode) {
        try {
            const orderRef = doc(db, "orders", docId);
            if (newStatusCode === 'approved') {
                await updateDoc(orderRef, { status: 'تم المقبول والتنفيذ ✅', statusCode: 'approved' });
            } else if (newStatusCode === 'rejected') {
                await updateDoc(orderRef, { status: 'مرفوض ❌ (تواصل مع الدعم)', statusCode: 'rejected' });
            }
            alert('✅ تم تحديث حالة الطلب سحابياً بنجاح.');
        } catch (err) {
            alert('خطأ في التحديث: ' + err.message);
        }
    };

    window.toggleCategory = function(catId) {
        const el = document.getElementById(catId);
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
    };

    window.openOrderModal = function(serviceName, basePrice) {
        let currentPrice = basePrice;
        document.querySelectorAll('.price-val').forEach(el => {
            if(el.parentElement.innerText.includes(serviceName)) {
                currentPrice = el.innerText;
            }
        });
        document.getElementById('modalServiceName').innerText = serviceName;
        document.getElementById('modalServicePrice').innerText = currentPrice;
        document.getElementById('orderModal').style.display = 'flex';
    };

    window.closeModal = function() {
        document.getElementById('orderModal').style.display = 'none';
    };

    window.accessAdminPanel = function() {
        const pwd = prompt('أدخل كلمة مرور الأدمن:');
        if (pwd === 'sasailmoseba1') {
            document.getElementById('adminPanel').style.display = 'block';
            alert('تمت المصادقة بنجاح كأدمن.');
        } else {
            alert('كلمة المرور غير صحيحة!');
        }
    };
</script>
